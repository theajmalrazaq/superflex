name: Build and Release SuperFlex

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 7.0.0)"
        required: false
        default: "7.0.0"
      updates:
        description: "Release notes / What's changed (leave empty for auto changelog)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        if: github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_VER="${{ github.event.inputs.version || github.ref_name }}"
          RELEASE_VER="${RELEASE_VER#v}"
          bun pm pkg set version="$RELEASE_VER"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build documentation
        run: bun run build:docs

      - name: Build Web Extension
        run: bun run build

      - name: Zip extension
        run: |
          cd dist && zip -r ../superflex.zip .

      - name: Bundle Web Assets for Android
        run: |
          chmod +x scripts/bundle-apk-assets.sh
          ./scripts/bundle-apk-assets.sh

      - name: Build Optimized Android APK
        run: |
          chmod +x android/build.sh
          ./android/build.sh SuperFlex.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperFlex-APK
          path: SuperFlex.apk
          if-no-files-found: error

      - name: Upload Web Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperFlex-Extension-ZIP
          path: superflex.zip
          if-no-files-found: error

      - name: Generate Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"
          mode: "HYBRID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Notes
        id: release_notes
        env:
          INPUT_UPDATES: ${{ github.event.inputs.updates }}
          AUTO_CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          DATE=$(date +'%Y-%m-%d')

          if [ -n "$INPUT_UPDATES" ]; then
            if [[ "$INPUT_UPDATES" == *"# 🚀 SuperFlex Update"* ]]; then
              BODY="$INPUT_UPDATES"
            else
              BODY=$(printf "# 🚀 SuperFlex Update\n\n## 🆕 Change Logs\n\n%s\n\n---\nBuilt on: %s" "$INPUT_UPDATES" "$DATE")
            fi
          else
            BODY="$AUTO_CHANGELOG"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: SuperFlex ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            superflex.zip
            SuperFlex.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
