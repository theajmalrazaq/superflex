name: Build and Release SuperFlex

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 6.0.0)"
        required: true
        default: "6.0.0"
      updates:
        description: "Release notes / What's changed"
        required: true
        default: "SuperFlex Update"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        if: github.event.inputs.version != ''
        run: |
          bun pm pkg set version="${{ github.event.inputs.version }}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build documentation
        run: bun run build:docs

      - name: Build
        run: bun run build

      - name: Debug dist content
        run: |
          echo "Listing dist directory:"
          ls -F dist/
          echo "Checking manifest.json in dist:"
          cat dist/manifest.json

      - name: Zip extension
        run: |
          # Zip the contents of the dist directory so manifest.json is at the root
          cd dist && zip -r ../superflex.zip .

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: SuperFlex ${{ github.event.inputs.version }}
          body: |
            ${{ github.event.inputs.updates }}

            ---
            Built on: ${{ steps.date.outputs.date }}
          files: superflex.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
