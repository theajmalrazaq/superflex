<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Superflex</title>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem("sf_preferences");
                var isDark = false;
                if (theme) {
                    var p = JSON.parse(theme);
                    isDark = p.state && p.state.themeMode === "dark";
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    isDark = true;
                }
                if (isDark) {
                    document.documentElement.classList.add("dark");
                    document.documentElement.style.backgroundColor = "#0B0B0F";
                } else {
                    document.documentElement.style.backgroundColor = "#FFFFFF";
                }
            } catch(e) {}
        })();
    </script>
    <link rel="icon" href="/__superflex__/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" />
    <link rel="stylesheet" href="/__superflex__/content.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="superflex-app superflex-standalone !visible" style="visibility: visible !important; margin: 0; padding: 0;">
    <!-- React SuperFlex Application Root -->
    <div id="react-chrome-app"></div>

    <!-- Container for In-Memory Login Form if unauthenticated -->
    <div id="superflex-login-container"></div>

    <!-- Hidden In-Memory Portal Container for background PJAX / HTML parsing -->
    <div class="m-grid m-grid--hor m-grid--root m-page" style="display: none !important; visibility: hidden !important; pointer-events: none !important;" aria-hidden="true"></div>

    <!-- Local Runtime Bundles -->
    <script src="/__superflex__/early.js"></script>
    <script src="/__superflex__/bridge.js"></script>
    <script src="/__superflex__/superflex.js"></script>
</body>
</html>
